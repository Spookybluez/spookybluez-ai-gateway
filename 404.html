<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found for SpookyBluez AI Gateway.">
  <title>Page Not Found | SpookyBluez AI Gateway</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070c;
      --panel: #0d1220;
      --text: #eef6ff;
      --muted: #9eb0c7;
      --cyan: #26f7d0;
      --magenta: #ff4fd8;
      --amber: #ffc857;
      --line: rgba(158, 176, 199, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(38, 247, 208, 0.13), transparent 28rem),
        radial-gradient(circle at 80% 10%, rgba(255, 79, 216, 0.12), transparent 26rem),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      padding: 24px;
    }

    main {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: clamp(28px, 6vw, 56px);
      background: rgba(13, 18, 32, 0.88);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .eyebrow {
      display: inline-flex;
      color: var(--cyan);
      border: 1px solid rgba(38, 247, 208, 0.28);
      background: rgba(38, 247, 208, 0.06);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-weight: 700;
    }

    h1 {
      margin: 18px 0;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      line-height: 0.96;
      letter-spacing: 0;
    }

    p {
      max-width: 620px;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 30px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 79, 216, 0.56);
      color: var(--text);
      background: rgba(255, 79, 216, 0.08);
      font-weight: 800;
      text-decoration: none;
    }

    a.primary {
      background: var(--cyan);
      color: #03100e;
      border-color: transparent;
      box-shadow: 0 0 30px rgba(38, 247, 208, 0.26);
    }

    a:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 4px;
    }

    @media (max-width: 520px) {
      a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">404</span>
    <h1>Route not found.</h1>
    <p>
      This endpoint did not match a published page. Head back to the AI Gateway
      demo or jump straight into the ngrok AI Gateway docs.
    </p>
    <div class="actions">
      <a class="primary" href="/">Back to Demo</a>
      <a href="https://ngrok.com/docs/ai-gateway/overview">AI Gateway Docs</a>
    </div>
  </main>
</body>
</html>
